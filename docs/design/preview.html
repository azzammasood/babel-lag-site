<style>
/* ---------- preview chrome (neutral; not part of any concept) ---------- */
:root{--cb:#f4f4f5;--cf:#18181b;--cm:#52525b;--ca:#1d4ed8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cb:#18181b;--cf:#f4f4f5;--cm:#a1a1aa;--ca:#93c5fd}}
:root[data-theme="dark"]{--cb:#18181b;--cf:#f4f4f5;--cm:#a1a1aa;--ca:#93c5fd}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cb);color:var(--cf);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
#chrome{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:var(--cb);border-bottom:1px solid color-mix(in srgb,var(--cf) 18%,transparent)}
#chrome b{font-size:13px}
#chrome .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#chrome .grp>span{color:var(--cm);font-size:12px;margin-right:2px}
#chrome button{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:6px;border:1px solid color-mix(in srgb,var(--cf) 30%,transparent);background:transparent;color:var(--cf);cursor:pointer}
#chrome button[aria-pressed="true"]{background:var(--cf);color:var(--cb);border-color:var(--cf)}
#chrome button:focus-visible,#site :focus-visible{outline:3px solid var(--ca);outline-offset:2px}
#chrome .note{color:var(--cm);font-size:12px;flex-basis:100%}
body.shot #chrome{display:none}

/* ---------- shared skeleton, themed by concept tokens ---------- */
#site{--bg:#fff;--surface:#fff;--text:#000;--muted:#444;--accent:#00f;--data:#00f;--dim:#ccc;
  background:var(--bg);color:var(--text);min-height:100vh;font-family:var(--font-body);overflow-x:hidden}
#site a{color:var(--accent)}
#site .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
#site header.top{display:flex;align-items:center;gap:10px 18px;padding:14px 16px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
#site .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:21px;text-decoration:none;color:var(--text);letter-spacing:var(--brand-ls,0)}
#site .brand svg{width:34px;height:34px}
#site nav ul{display:flex;flex-wrap:wrap;gap:2px 14px;list-style:none;margin:0;padding:0;font-size:13px}
#site nav a{color:var(--muted);text-decoration:none}
#site nav a[aria-current]{color:var(--text);font-weight:600;border-bottom:2px solid var(--accent)}
#site .ink{fill:var(--text)} #site .lit{fill:var(--accent)} #site .off{fill:var(--text);opacity:.22}
#site .st{stroke:var(--text)} #site .stl{stroke:var(--accent)}
#site h1,#site h2{font-family:var(--font-head);line-height:1.02;margin:0 0 .35em}
#site h2{font-size:clamp(20px,2.6vw,30px)}
#site .lede{font-size:clamp(15px,1.6vw,19px);color:var(--muted);max-width:60ch}
#site .muted{color:var(--muted)} #site .small{font-size:12.5px}
#site .src{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
#site section{padding:22px 0}
#site .key{font-size:12.5px;color:var(--muted);margin-top:8px}
#site .empty{border:1.5px dashed var(--muted);padding:14px 16px;color:var(--muted);font-size:13.5px}
#site .empty b{color:var(--text)}
#site .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
#site footer{border-top:1px solid var(--dim);margin-top:24px;padding:18px 0 34px;font-size:12.5px;color:var(--muted)}
#site svg text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
#site svg .tx{fill:var(--text)}
#site .replay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#site .replay button{font:inherit;padding:3px 10px;border:1px solid var(--muted);background:transparent;color:var(--text);cursor:pointer;border-radius:4px}
#site .scroll{overflow-x:auto}
#site .nat{font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI","Ebrima",sans-serif}
#site .engines{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
#site .engines .on{color:var(--text);font-weight:600} #site .engines .no{color:var(--muted)}

/* ===== 1 Blackout ===== */
.c-blackout{--font-head:"Big Shoulders Display",Impact,sans-serif;--font-body:"Inter",system-ui,sans-serif;--brand-ls:.02em}
.c-blackout h1{font-size:clamp(44px,9vw,128px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.c-blackout h1 em{font-style:normal;color:var(--accent)}
.c-blackout .wall{display:flex;flex-direction:column;gap:0}
.c-blackout .wl{display:flex;align-items:baseline;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;border-top:1px solid var(--dim);padding:2px 0}
.c-blackout .word{font-size:clamp(38px,8.4vw,112px);font-weight:800;line-height:1.12;color:transparent;-webkit-background-clip:text;background-clip:text;white-space:nowrap}
.c-blackout .wl .m{font-family:var(--font-head);font-size:clamp(14px,1.6vw,19px);font-weight:500;color:var(--muted);text-align:right;letter-spacing:.03em;text-transform:uppercase}
.c-blackout .wl .m b{color:var(--accent);font-weight:800}
.c-blackout .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px;padding:14px;background:var(--surface);border:1px solid var(--dim)}
.c-blackout .board i{display:block;aspect-ratio:1;border-radius:50%;background:var(--dim)}
.c-blackout .giant{font-family:var(--font-head);font-weight:900;font-size:clamp(56px,11vw,150px);line-height:.9;color:var(--accent)}
.c-blackout .giant{margin-bottom:18px}
.c-blackout .giant small{display:block;font-size:clamp(14px,1.6vw,19px);font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}

/* ===== 2 Departures ===== */
.c-departures{--font-head:"Space Mono",ui-monospace,monospace;--font-body:"Inter",system-ui,sans-serif;--flap-bg:#18181B;--flap-fg:#F4F4F4;--flap-hi:#FFC400}
.c-departures h1{font-size:clamp(28px,4.6vw,56px);font-weight:700;letter-spacing:-.03em}
.c-departures .boardw{background:#0A0A0B;border-radius:10px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);overflow-x:auto}
.c-departures .bh{display:grid;grid-template-columns:var(--cols);gap:12px;color:#FFC400;font:700 11px/1 var(--font-head);letter-spacing:.12em;text-transform:uppercase;padding:0 0 8px}
.c-departures .br{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:3px 0}
.c-departures .fl{display:flex;gap:2px}
.c-departures .fl span{position:relative;display:inline-block;width:1.05em;height:1.55em;line-height:1.55em;text-align:center;background:var(--flap-bg);color:var(--flap-fg);font:700 clamp(12px,1.35vw,17px)/1.55em var(--font-head);border-radius:3px;text-transform:uppercase;animation:flip .5s cubic-bezier(.3,1.6,.6,1) both;animation-delay:calc(var(--i)*18ms)}
.c-departures .fl span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.c-departures .fl.hi span{color:var(--flap-hi)}
.c-departures .fl.nat span{width:auto;min-width:1.05em;padding:0 .3em;text-transform:none;font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI",sans-serif}
@keyframes flip{0%{transform:perspective(200px) rotateX(-90deg);opacity:.2}100%{transform:none;opacity:1}}
.c-departures .clock{display:flex;gap:18px;flex-wrap:wrap}
.c-departures .clock>div{background:#0A0A0B;border-radius:10px;padding:12px 14px}
.c-departures .clock .k{color:#C9C9CF;font:700 11px var(--font-head);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}

/* ===== 3 Seismograph ===== */
.c-seismograph{--font-head:"IBM Plex Serif",Georgia,serif;--font-body:"IBM Plex Mono",ui-monospace,monospace}
.c-seismograph h1{font-size:clamp(32px,5.6vw,72px);font-weight:400;font-style:italic;max-width:16ch}
.c-seismograph .paper{background-color:var(--surface);background-image:linear-gradient(var(--dim) 1px,transparent 1px),linear-gradient(90deg,var(--dim) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--dim)}
.c-seismograph .trace{fill:none;stroke:var(--data);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.2s ease-out forwards;animation-delay:calc(var(--i)*70ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.c-seismograph .mag{font-family:var(--font-head);font-size:clamp(48px,8vw,104px);line-height:1;color:var(--data)}
.c-seismograph[data-t="dark"] .trace{filter:drop-shadow(0 0 3px var(--data))}

/* ===== 4 Light-years ===== */
.c-lightyears{--font-head:"Unbounded",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif}
.c-lightyears h1{font-size:clamp(28px,4.8vw,62px);font-weight:700;letter-spacing:-.02em;max-width:18ch}
.c-lightyears h1 em{font-style:normal;color:var(--accent)}
.c-lightyears .space{background:radial-gradient(ellipse at 0% 50%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),var(--surface);border:1px solid var(--dim);border-radius:18px}

/* ===== 5 Riso ===== */
.c-riso{--font-head:"Anton",Impact,sans-serif;--font-body:"Archivo",system-ui,sans-serif;--ink1:#FF48B0;--ink2:#0078BF;--blend:multiply}
.c-riso[data-t="dark"]{--blend:screen}
.c-riso h1{font-size:clamp(40px,7vw,96px);font-weight:400;text-transform:uppercase;line-height:.92}
.c-riso .poster{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
.c-riso .huge{position:relative;font-family:var(--font-head);font-size:clamp(120px,26vw,340px);line-height:.8;letter-spacing:-.02em}
.c-riso .huge span{display:block;mix-blend-mode:var(--blend)}
.c-riso .huge .a{color:var(--ink1)}
.c-riso .huge .b{position:absolute;inset:0;color:var(--ink2);transform:translate(7px,5px)}
.c-riso .stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.c-riso .stamp{border:2px solid var(--text);padding:8px;background:var(--surface)}
.c-riso .stamp .code{font-family:var(--font-head);font-size:34px;line-height:1;text-transform:uppercase}
.c-riso .stamp svg{display:block;width:100%;height:auto}
.c-riso .stamp svg g{mix-blend-mode:var(--blend)}
.c-riso h2{margin-top:14px}
.c-riso .tag{display:inline-block;font-family:var(--font-head);text-transform:uppercase;border:2.5px solid currentColor;padding:2px 8px;transform:rotate(-3deg);margin:4px 6px 4px 0}
.c-riso .tag.on{color:var(--accent)} .c-riso .tag.no{color:var(--muted);transform:rotate(2deg);border-style:dashed}
@media (max-width:700px){.c-riso .poster{grid-template-columns:1fr}}

/* ===== 6 Babel Tower ===== */
.c-tower{--font-head:"Fraunces",Georgia,serif;--font-body:"Work Sans",system-ui,sans-serif}
.c-tower h1{font-size:clamp(34px,6vw,80px);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.c-tower .sky{background:linear-gradient(180deg,color-mix(in srgb,var(--data) 14%,var(--bg)),var(--bg) 70%);border-radius:4px}

@media (prefers-reduced-motion:reduce){#site *{animation:none!important;transition:none!important;stroke-dashoffset:0!important}}
</style>
