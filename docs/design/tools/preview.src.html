<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babel Lag design preview</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,800&family=Work+Sans:wght@400;600&family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@500;800&family=Noto+Sans+Devanagari:wght@500;800&family=Noto+Sans+Bengali:wght@500;800&family=Noto+Sans+Ethiopic:wght@500;800&family=Noto+Sans+Gurmukhi:wght@500;800&family=Noto+Sans+Tamil:wght@500;800&family=Noto+Sans+Telugu:wght@500;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* ---------- preview chrome (neutral; not part of any concept) ---------- */
:root{--cb:#f4f4f5;--cf:#18181b;--cm:#52525b;--ca:#1d4ed8;color-scheme:light dark}
:root[data-theme="dark"]{--cb:#18181b;--cf:#f4f4f5;--cm:#a1a1aa;--ca:#93c5fd}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cb);color:var(--cf);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
#chrome{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:var(--cb);border-bottom:1px solid color-mix(in srgb,var(--cf) 18%,transparent)}
#chrome b{font-size:13px}
#chrome .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#chrome .grp>span{color:var(--cm);font-size:12px;margin-right:2px}
#chrome button{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:6px;border:1px solid color-mix(in srgb,var(--cf) 30%,transparent);background:transparent;color:var(--cf);cursor:pointer}
#chrome button[aria-pressed="true"]{background:var(--cf);color:var(--cb);border-color:var(--cf)}
#chrome button:focus-visible,#site :focus-visible{outline:3px solid var(--ca);outline-offset:2px}
#chrome .note{color:var(--cm);font-size:12px;flex-basis:100%}
body.shot #chrome{display:none}

/* ---------- shared skeleton ---------- */
#site{--bg:#fff;--surface:#fff;--text:#000;--muted:#444;--accent:#00f;--data:#00f;--dim:#ccc;
  background:var(--bg);color:var(--text);min-height:100vh;font-family:var(--font-body);overflow-x:clip;font-size:15px;line-height:1.5}
#site a{color:var(--accent)}
#site .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
#site header.top{display:flex;align-items:center;gap:10px 18px;padding:14px 16px;flex-wrap:wrap;max-width:1160px;margin:0 auto}
#site .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:21px;text-decoration:none;color:var(--text)}
#site .brand svg{width:32px;height:32px}
#site nav ul{display:flex;flex-wrap:wrap;gap:2px 14px;list-style:none;margin:0;padding:0;font-size:13px}
#site nav a{color:var(--muted);text-decoration:none}
#site nav a[aria-current]{color:var(--text);font-weight:600;border-bottom:2px solid var(--accent)}
#site .ink{fill:var(--text)} #site .lit{fill:var(--accent)} #site .off{fill:var(--text);opacity:.22}
#site .st{stroke:var(--text)} #site .stl{stroke:var(--accent)}
#site h1,#site h2,#site h3{font-family:var(--font-head);line-height:1.05;margin:0 0 .4em}
#site h1{font-size:clamp(32px,5.4vw,70px)}
#site h1 em{font-style:normal;color:var(--accent)}
#site h2{font-size:clamp(19px,2.3vw,26px)}
#site .lede{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:62ch}
#site .muted{color:var(--muted)} #site .small{font-size:12.5px}
#site .src{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
#site section{padding:18px 0}
#site .key{font-size:12.5px;color:var(--muted);margin-top:10px}
#site .empty{border:1.5px dashed var(--muted);padding:14px 16px;color:var(--muted);font-size:13.5px}
#site .empty b{color:var(--text)}
#site .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
#site .big{font-family:var(--font-head);font-size:clamp(30px,4.4vw,54px);line-height:1;color:var(--text)}
#site footer{border-top:1px solid var(--dim);margin-top:24px;padding:18px 0 34px;font-size:12.5px;color:var(--muted)}
#site .scroll{overflow-x:auto}
#site .nat{font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI","Ebrima",sans-serif}
#site table{border-collapse:collapse;width:100%;font-size:13.5px}
#site th,#site td{padding:5px 8px;border-bottom:1px solid var(--dim);text-align:left;vertical-align:baseline}
#site th{font-size:12px;color:var(--muted);font-weight:600}
#site tr.cur td{background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:600}
#site .r{text-align:right;font-variant-numeric:tabular-nums}
#site .ctl{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px;color:var(--muted)}
#site .ctl button{font:inherit;padding:5px 14px;border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer;border-radius:99px}
#site .ctl output{font-family:var(--font-head);font-size:clamp(22px,3vw,34px);color:var(--text);min-width:8ch;line-height:1}
#site .mini{display:inline-block;vertical-align:middle;width:120px;height:8px;background:var(--dim);position:relative}
#site .mini i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
#site .stage{position:relative;height:min(78vh,720px);min-height:440px;overflow:hidden}
#site .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#site .hud{position:absolute;left:0;right:0;bottom:12px;z-index:4;pointer-events:none}
#site .hud .wrap>b{display:block;font-family:var(--font-head);font-size:clamp(20px,2.8vw,34px);line-height:1.1}
#site .hud .wrap>span{font-size:13px;color:var(--muted)}
/* CSS 3D box with labelled faces */
#site .bx{position:absolute;left:0;top:0;transform-style:preserve-3d}
#site .bx i{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-style:normal;backface-visibility:hidden}
#site .bx .fr,#site .bx .bk{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2)}
#site .bx .lf,#site .bx .rt{width:var(--d);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--d)/-2)}
#site .bx .tp{width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2)}
#site .bx .fr{transform:translateZ(calc(var(--d)/2));background:var(--c)}
#site .bx .bk{transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:var(--c)}
#site .bx .rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:color-mix(in srgb,var(--c) 86%,#000)}
#site .bx .lf{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:color-mix(in srgb,var(--c) 86%,#000)}
#site .bx .tp{transform:rotateX(90deg) translateZ(calc(var(--h)/2));background:color-mix(in srgb,var(--c) 80%,#fff)}

/* ===== 1 Babel Tower ===== */
.c-tower{--font-head:"Fraunces",Georgia,serif;--font-body:"Work Sans",system-ui,sans-serif}
.c-tower h1{font-weight:800;letter-spacing:-.02em}
.c-tower .split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:18px;align-items:stretch}
.c-tower .stage{background:linear-gradient(180deg,color-mix(in srgb,var(--data) 18%,var(--bg)),var(--bg) 80%);border-radius:6px}
.c-tower .stage3d{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 38%}
.c-tower .world{position:absolute;left:50%;top:90%;transform-style:preserve-3d}
.c-tower .ground{position:absolute;left:0;top:0;width:1100px;height:1100px;margin:-550px 0 0 -550px;transform:rotateX(90deg);background:radial-gradient(circle,color-mix(in srgb,var(--text) 22%,transparent),transparent 62%)}
.c-tower .fl3{position:absolute;left:0;top:0;transform-style:preserve-3d;transform:translate3d(0,calc(var(--y) - 420px),0);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.3,1.1),opacity .25s}
.c-tower .fl3.in{transform:translate3d(0,var(--y),0);opacity:1}
.c-tower .fl3 .bx{--c:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.c-tower .fl3.new .bx{--c:color-mix(in srgb,var(--accent) 62%,var(--surface))}
.c-tower .fl3 .bx i{font:800 15px/1 "Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI","Ebrima",sans-serif;color:var(--text)}
.c-tower .fl3 .bx .lf,.c-tower .fl3 .bx .rt{font:600 11.5px/1 var(--font-body)}
.c-tower .col3{position:absolute;left:0;top:0;transform-style:preserve-3d;opacity:0;transition:opacity .2s}
.c-tower .col3.in{opacity:1}
.c-tower .col3 .bx{--c:var(--data)} .c-tower .col3.new .bx{--c:var(--accent)}
.c-tower .log{list-style:none;margin:0;padding:0;font-size:13.5px;align-self:center}
.c-tower .log li{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:3px 8px;border-left:3px solid var(--dim);color:var(--muted);align-items:baseline}
.c-tower .log li.in{color:var(--text);border-left-color:var(--accent)}
.c-tower .log li.new{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.c-tower .log .t{font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:860px){.c-tower .split{grid-template-columns:1fr}.c-tower .stage{height:520px;min-height:0}}
/* ===== 2 Ripple ===== */
.c-ripple{--font-head:"Space Grotesk",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif}
.c-ripple h1{letter-spacing:-.03em;font-weight:700}
.c-ripple .stage{background:radial-gradient(ellipse at 50% 62%,color-mix(in srgb,var(--data) 16%,var(--bg)),var(--bg) 72%)}
/* ===== 3 Red Link ===== */
.c-redlink{--font-head:"Source Serif 4",Georgia,serif;--font-body:"Inter",system-ui,sans-serif}
.c-redlink h1{font-weight:600}
.c-redlink .lk{color:var(--accent);text-decoration:underline}.c-redlink .rl{color:var(--data);text-decoration:underline dashed}
.c-redlink .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.c-redlink .persp{perspective:1300px}
.c-redlink .card{background:var(--surface);border:1px solid var(--dim);border-radius:10px;padding:22px 24px;transform:rotateY(-14deg) rotateX(5deg);transform-origin:50% 50%;box-shadow:18px 26px 0 -8px color-mix(in srgb,var(--text) 14%,transparent),0 40px 70px rgba(0,0,0,.18);transition:transform .32s ease-in;min-height:330px}
.c-redlink .card.out{transform:rotateY(-104deg) rotateX(5deg)}
.c-redlink .card .nat{font-size:clamp(34px,5vw,62px);font-weight:800;line-height:1.15;display:block}
.c-redlink .words{display:flex;flex-wrap:wrap;gap:7px 6px;margin-top:10px;perspective:500px}
.c-redlink .words i{height:9px;display:block;border-bottom:2px dashed var(--data)}
.c-redlink .words i.b{animation:toblue .5s ease-in-out both;animation-delay:calc(var(--k)*28ms + var(--d,0ms))}
@keyframes toblue{0%{transform:rotateX(0);border-bottom:2px dashed var(--data);background:transparent}49%{transform:rotateX(90deg);border-bottom:2px dashed var(--data);background:transparent}51%{transform:rotateX(90deg);border-bottom:0 solid transparent;background:var(--accent)}100%{transform:rotateX(0);border-bottom:0 solid transparent;background:var(--accent);border-radius:2px}}
.c-redlink.still .words i.b{animation-duration:.001s;animation-delay:0s}
.c-redlink .paras{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 28px}
.c-redlink .para h3{font-size:19px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.c-redlink .para h3 .nat{font-size:22px;font-weight:800}
.c-redlink .mt{font:400 12.5px var(--font-body);color:var(--muted);flex-basis:100%}
.c-redlink .odo{display:flex;gap:6px;perspective:700px}
.c-redlink .odo .dg{width:.72em;height:1.2em;overflow:hidden;font:700 clamp(44px,9vw,120px)/1.2 "JetBrains Mono",ui-monospace,monospace;background:linear-gradient(color-mix(in srgb,var(--text) 22%,var(--surface)),var(--surface) 30%,var(--surface) 70%,color-mix(in srgb,var(--text) 22%,var(--surface)));border:1px solid var(--dim);border-radius:8px;text-align:center;transform:rotateX(8deg)}
.c-redlink .odo .dg span{display:block;transition:transform .7s cubic-bezier(.3,1.2,.5,1);transform:translateY(calc(var(--n)*-1.2em))}
.c-redlink .odo .dg span b{display:block;height:1.2em;font-weight:700}
.c-redlink .odo .sep{font:700 clamp(44px,9vw,120px)/1.2 "JetBrains Mono",monospace;color:var(--muted)}
@media (max-width:860px){.c-redlink .hero{grid-template-columns:1fr}.c-redlink .card{transform:none}.c-redlink .card.out{transform:rotateY(-90deg)}}
@media (prefers-reduced-motion:reduce){#site *{animation-duration:.001s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div id="chrome" role="toolbar" aria-label="Preview controls">
  <b>Babel Lag design gate</b>
  <div class="grp" id="g-c"><span>Concept</span></div>
  <div class="grp" id="g-v"><span>Page</span></div>
  <div class="grp" id="g-t"><span>Theme</span></div>
  <div class="grp" id="g-l"><span>Logo</span></div>
  <div class="note" id="chrome-note"></div>
</div>
<main id="site"></main>
<script>
"use strict";
const D=/*__DATA__*/null, PAL=/*__PALETTES__*/null, LOGOS=/*__LOGOS__*/null;
const CONCEPTS=[
 {id:"tower",name:"Babel Tower",tag:"The project's namesake, built in 3D in the order knowledge arrives: one floor per language, placed at its median lag, as wide as its coverage."},
 {id:"ripple",name:"Ripple",tag:"Knowledge spreading as a wave: a ring leaves the first article at one year per second and each language lights up when the ring reaches its lag."},
 {id:"redlink",name:"Red Link",tag:"Wikipedia's own grammar in 3D: red links (missing) flip to blue (written) up to each language's coverage."}];
const NAMES={am:["Amharic","አማርኛ"],bn:["Bengali","বাংলা"],cy:["Welsh","Cymraeg"],el:["Greek","Ελληνικά"],eo:["Esperanto","Esperanto"],ha:["Hausa","Hausa"],hi:["Hindi","हिन्दी"],ig:["Igbo","Igbo"],mr:["Marathi","मराठी"],ms:["Malay","Melayu"],ne:["Nepali","नेपाली"],pa:["Punjabi","ਪੰਜਾਬੀ"],so:["Somali","Soomaali"],sw:["Swahili","Kiswahili"],ta:["Tamil","தமிழ்"],te:["Telugu","తెలుగు"],tl:["Tagalog","Tagalog"],ur:["Urdu","اردو"],yo:["Yoruba","Yorùbá"],zu:["Zulu","isiZulu"]};
const RTL=new Set(["ur"]);
const NATF='"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI","Ebrima",sans-serif';
const NAV=["Now","Languages","Topics","Backtests","Pipeline Live","Lineage","Catalog","Method and data","How it's built","The maker","Corrections"];
const LOGO_KEYS=Object.keys(LOGOS);
const st={c:"tower",v:"home",t:"dark",l:LOGO_KEYS[0],shot:0};
location.hash.slice(1).split("&").forEach(p=>{const [k,v]=p.split("=");if(k in st&&v)st[k]=decodeURIComponent(v)});
if(+st.shot)document.body.classList.add("shot");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches, FROZEN=reduced||+st.shot;

// ---------- display helpers (formatting only; no new numbers) ----------
const fmt=n=>n==null?"not measured":Number(n).toLocaleString("en-US");
const fmt1=n=>n==null?"not measured":Number(n).toLocaleString("en-US",{maximumFractionDigits:1});
const yrs=d=>(d/365.25).toLocaleString("en-US",{maximumFractionDigits:1});
const day=s=>s?s.slice(0,16).replace("T"," ")+" UTC":"n/a";
const hr=s=>s.slice(5,13).replace("T"," ")+"h";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=p=>`<span class="src">${esc(p)}</span>`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),easeOut=k=>1-Math.pow(1-k,3);
const L=D.languages.rows.slice(), P=D.pipeline, LV=D.live, H=LV.hourly, M=LV.matrix;
const byCov=L.slice().sort((a,b)=>b.coverage_pct-a.coverage_pct), byLag=L.slice().sort((a,b)=>a.median_lag_days-b.median_lag_days);
const maxCov=Math.max(...L.map(r=>r.coverage_pct)), maxLag=Math.max(...L.map(r=>r.median_lag_days)), yrMax=Math.ceil(maxLag/365.25);
const fastest=byLag[0], slowest=byLag[byLag.length-1], darkest=byCov[byCov.length-1], brightest=byCov[0];
const maxH=Math.max(...H.map(h=>h.events)), LGC=Math.log1p(Math.max(...M.events.flat()));
const nm=c=>NAMES[c]?NAMES[c][0]:c, nat=c=>NAMES[c]?NAMES[c][1]:c, lagY=r=>r.median_lag_days/365.25;
const lit100=r=>Math.round(r.coverage_pct);
const natS=r=>`<span class="nat" lang="${r.language}"${RTL.has(r.language)?' dir="rtl"':""}>${nat(r.language)}</span>`;
const wikisAt=i=>M.events.filter(r=>r[i]>0).length;
const hourText=i=>`${hr(H[i].hour)} UTC · ${fmt(H[i].events)} events`;
const setT=(id,s)=>{const e=document.getElementById(id);if(e&&e.textContent!==s)e.textContent=s};
let TK={}, RUNS=[], RAF=0, TIMERS=[];

// ---------- time engine: every animation is a clock over measured values (never scroll, never the pointer) ----------
function run(id,dur,hold,shotT,fn){const S={t0:null,paused:false,at:0};RUNS.push(S);
 S.tick=now=>{if(FROZEN){fn(+st.shot?shotT:dur,0);return}if(S.paused)return;if(S.t0==null)S.t0=now;let e=(now-S.t0)/1000;if(e>dur+hold){S.t0=now;e=0}S.at=e;fn(Math.min(dur,e),now/1000)};
 setTimeout(()=>{const re=document.getElementById(id+"-re"),pp=document.getElementById(id+"-pp");if(re)re.onclick=()=>{S.t0=null;S.paused=false;if(pp)pp.textContent="Pause"};
  if(pp)pp.onclick=()=>{S.paused=!S.paused;pp.textContent=S.paused?"Play":"Pause";if(!S.paused)S.t0=performance.now()-S.at*1000}},0);return S}
function ctl(id,label){return `<div class="ctl">${FROZEN?"":`<button type="button" id="${id}-re">Replay</button><button type="button" id="${id}-pp">Pause</button>`}<output id="${id}-out" aria-live="off"></output><span id="${id}-n"></span><span>${label}</span></div>`}
function frame(now){RUNS.forEach(s=>s.tick(now));if(!FROZEN)RAF=requestAnimationFrame(frame)}
function cv(el){const c=el.querySelector("canvas"),dpr=Math.min(2,devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;
 if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
 const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);return [x,w,h]}
function cam(w,h,pitch,dist,f,oy=0){const cp=Math.cos(pitch),sp=Math.sin(pitch);return (x,y,z)=>{const y2=y*cp-z*sp,z2=y*sp+z*cp+dist,s=f/Math.max(.05,z2);return [w/2+x*s,h/2+oy-y2*s,s,z2]}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function box(w,h,d,front="",side=""){return `<div class="bx" style="--w:${w}px;--h:${h}px;--d:${d}px"><i class="fr">${front}</i><i class="bk">${front}</i><i class="lf">${side}</i><i class="rt">${side}</i><i class="tp"></i></div>`}

// ---------- shared page parts ----------
function logo(){return LOGOS[st.l].replace(/<style>[\s\S]*?<\/style>/,"").replace(/<title[^>]*>[\s\S]*?<\/title>/,"").replace(/ aria-labelledby="t"/,' aria-hidden="true"')}
function header(cur){return `<header class="top"><a class="brand" href="#" aria-label="Babel Lag home">${logo()}<span>Babel Lag</span></a>
 <nav aria-label="Main"><ul>${NAV.map(n=>`<li><a href="#" ${n===cur?'aria-current="page"':""}>${n}</a></li>`).join("")}</ul></nav></header>`}
function prov(){const m=D.languages.meta;return `<p class="small muted">Profile <b>${esc(m.produced_by.profile)}</b>${m.produced_by.fallback?" (fallback)":""} · generated ${day(m.generated_at)} · slice of ${L.length} languages · ${src("languages.json")}</p>`}
function footer(){const s=[...D.languages.meta.sources,...D.live.meta.sources];return `<footer><div class="wrap"><p><b>Data:</b> Wikimedia Foundation: ${s.map(x=>`<a href="${esc(x.url)}">${esc(x.name)}</a>`).join(" · ")}. Wikidata and the Wikimedia dumps are CC0. Babel Lag is independent and non-commercial, not affiliated with or endorsed by the Wikimedia Foundation.</p>
 <p>Lag is measured on Wikipedia only; it says nothing about other media in a language. In this slice the "first article" is the earliest among the ${L.length} followed languages. Aggregates only: no editor is named, ranked or profiled. <a href="#">Method and limits</a> · <a href="${esc(D.languages.meta.corrections||"#")}">Corrections</a> · Code MIT.</p></div></footer>`}
function empties(){return `<section class="wrap"><div class="row2"><div class="empty" role="note"><b>Topics: nothing tracked yet.</b> Live topic tracking arrives in milestone 3. Until a topic is measured, this stays empty.</div>
 <div class="empty" role="note"><b>Backtests: none yet.</b> Backtests of past events arrive in milestone 3. No numbers until they are measured.</div></div></section>`}
function dataTable(){return `<section class="wrap"><details class="data"><summary style="cursor:pointer;color:var(--accent)">The same data as a table (${L.length} languages)</summary><div class="scroll"><table><thead><tr><th>Language</th><th class="r">Median lag (years)</th><th class="r">Coverage %</th><th class="r">Items covered</th><th class="r">Pageviews</th></tr></thead><tbody>${byLag.map(r=>`<tr><td>${nm(r.language)} ${natS(r)}</td><td class="r">${yrs(r.median_lag_days)}</td><td class="r">${r.coverage_pct}</td><td class="r">${fmt(r.items_covered)}</td><td class="r">${fmt(r.pageviews)}</td></tr>`).join("")}</tbody></table></div></details></section>`}
function engTable(){return `<section class="wrap"><h2>Engines</h2><div class="scroll"><table><thead><tr><th>Engine</th><th>Version</th><th>Role</th><th>Last run</th></tr></thead><tbody>${P.engines.map(e=>`<tr><td>${e.active?"●":"○"} ${esc(e.name)}</td><td>${esc(e.version)}</td><td>${esc(e.role)}</td><td>${e.active?"<b>ran in last run</b>":'<span class="muted">not in last run</span>'}</td></tr>`).join("")}</tbody></table></div></section>`}
function readouts(){return `<div class="row2"><div><div class="big">${fmt1(P.live.events_per_second)}/s</div><div class="key">events per second, last window ${src("live.events_per_second")}</div></div>
 <div><div class="big">${fmt1(P.live.end_to_end_latency_s)} s</div><div class="key">event time to published table ${src("live.end_to_end_latency_s")}</div></div>
 <div><div class="big">${fmt(P.totals.wikis)}</div><div class="key">wikis heard ${src("totals.wikis")}</div></div>
 <div><div class="big">$${P.cost.usd}</div><div class="key">cost of the run ${src("cost.usd")}</div></div></div>`}
function hourTable(){return `<div class="scroll"><table id="ht"><thead><tr><th>Hour (UTC)</th><th class="r">Events</th><th></th><th class="r">New articles</th><th class="r">Human article edits</th><th class="r">Bot events</th><th class="r">Wikis active</th></tr></thead><tbody>${H.map((d,i)=>`<tr data-i="${i}"><td>${hr(d.hour)}</td><td class="r">${fmt(d.events)}</td><td><span class="mini" aria-hidden="true"><i style="width:${(100*d.events/maxH).toFixed(1)}%"></i></span></td><td class="r">${fmt(d.new_articles)}</td><td class="r">${fmt(d.human_article_edits)}</td><td class="r">${fmt(d.bot_events)}</td><td class="r">${wikisAt(i)}</td></tr>`).join("")}</tbody></table></div><p class="key">Measured hours from live.json, oldest first. A replay, not a live feed.</p>`}
const yearNote="1 second = 1 year of median lag";

const R={};
/* ===== 1 Babel Tower ===== */
R.tower={home(){const FH=27,n=L.length,sz=r=>Math.round(74+290*r.coverage_pct/maxCov);
 const floors=byLag.map((r,i)=>`<div class="fl3" data-i="${i}" style="--y:${-(i*FH+FH/2)}px">${box(sz(r),FH-2,sz(r),esc(nat(r.language)),`${nm(r.language)} ${r.coverage_pct}%`)}</div>`).join("");
 run("tw",yrMax,5,yrMax,(T,now)=>{const wo=document.getElementById("tw-w");if(!wo)return;const sc=Math.min(1,wo.parentNode.clientWidth/640,wo.parentNode.clientHeight/700);
  wo.style.transform=`scale(${sc.toFixed(3)}) rotateX(-14deg) rotateY(${(FROZEN?32:28+now*7).toFixed(2)}deg)`;let k=0,last=-1;
  byLag.forEach((r,i)=>{const on=T>=lagY(r);if(on){k++;last=i}});
  wo.querySelectorAll(".fl3").forEach(f=>{const i=+f.dataset.i;f.classList.toggle("in",i<k);f.classList.toggle("new",i===last&&T<yrMax&&T-lagY(byLag[i])<.6)});
  document.querySelectorAll("#tw-log li").forEach((li,i)=>{li.classList.toggle("in",i<k);li.classList.toggle("new",i===last&&T<yrMax&&T-lagY(byLag[i])<.6)});
  setT("tw-out","Year "+T.toFixed(1));setT("tw-n",`${k} of ${n} floors built ·`)});
 return `<section class="wrap"><h1>The tower of Babel, built at the speed knowledge <em>actually</em> travels.</h1><p class="lede">A new topic gets its first Wikipedia article at year 0. Each language adds its floor when the median topic reaches it, and the floor is only as wide as the share of topics that language covers. It takes ${yrs(slowest.median_lag_days)} years to finish.</p>${prov()}
 ${ctl("tw",yearNote)}</section>
 <section class="wrap"><div class="split"><div class="stage" role="img" aria-label="A 3D tower of ${n} floors, one per language, placed in order of median lag from ${nm(fastest.language)} (${yrs(fastest.median_lag_days)} years) at the base to ${nm(slowest.language)} (${yrs(slowest.median_lag_days)} years) at the top; floor width is coverage."><div class="stage3d" aria-hidden="true"><div class="world" id="tw-w"><div class="ground"></div>${floors}</div></div></div>
 <ol class="log" id="tw-log" reversed aria-label="Floors, top to bottom">${byLag.slice().reverse().map(r=>`<li><span class="t">+${yrs(r.median_lag_days)} yrs</span><span>${natS(r)} ${nm(r.language)}</span><span>${r.coverage_pct}%</span></li>`).join("")}</ol></div>
 <p class="key">Floor order and timing = median_lag_days. Floor width = coverage_pct (widest: ${nm(brightest.language)}, ${brightest.coverage_pct}%). The tower turns slowly so every face can be read; Pause stops it.</p></section>${dataTable()}${empties()}`},
 pipe(){const n=H.length,STEP=.4;
 const cols=H.map((d,i)=>{const hh=Math.round(8+230*d.events/maxH);return `<div class="col3" data-i="${i}" style="transform:translate3d(${(i-(n-1)/2)*27}px,${-hh/2}px,0)">${box(20,hh,20)}</div>`}).join("");
 run("tp",n*STEP,5,n*STEP*.55,(T)=>{const k=Math.min(n-1,Math.floor(T/STEP));document.querySelectorAll("#tp-w .col3").forEach(c=>{const i=+c.dataset.i;c.classList.toggle("in",i<=k);c.classList.toggle("new",i===k)});
  document.querySelectorAll("#ht tr[data-i]").forEach(r=>r.classList.toggle("cur",+r.dataset.i===k));const wo=document.getElementById("tp-w");wo.style.transform=`scale(${Math.min(1,wo.parentNode.clientWidth/1000).toFixed(3)}) rotateX(-20deg) rotateY(-28deg)`;
  setT("tp-out",hr(H[k].hour));setT("tp-n",`${fmt(H[k].events)} events · ${wikisAt(k)} wikis active ·`)});
 return `<section class="wrap"><h1>Laid course by course, <em>hour by hour</em>.</h1><p class="lede">The live stream as the tower's brickwork: one column for each measured hour, as tall as the events the collector heard across ${LV.wikis} wikis.</p>${readouts()}${ctl("tp","replay of "+n+" measured hours")}</section>
 <section class="wrap"><div class="stage" style="height:min(56vh,480px);min-height:340px" role="img" aria-label="3D columns of events per measured hour; peak ${fmt(maxH)}."><div class="stage3d" aria-hidden="true" style="perspective-origin:50% 20%"><div class="world" id="tp-w" style="top:82%"><div class="ground"></div>${cols}</div></div></div></section>
 <section class="wrap">${hourTable()}</section>${engTable()}`}};

/* ===== 2 Ripple ===== */
R.ripple={home(){const rad=y=>.45+y*.43,pos=byLag.map((r,i)=>{const a=-Math.PI/2+i*2.399963,q=rad(lagY(r));return {r,x:q*Math.cos(a),z:q*Math.sin(a)}});
 run("rp",yrMax+.8,5,6.3,(T)=>{const el=document.getElementById("rp-st");if(!el)return;const [x,w,h]=cv(el),pr=cam(w,h,.62,9.6,Math.min(w*.92,h*1.6),h*.2),dark=st.t==="dark";
  const ring=(q,style,lw)=>{x.strokeStyle=style;x.lineWidth=lw;x.beginPath();for(let k=0;k<=120;k++){const a=k/120*6.2832,s=pr(q*Math.cos(a),0,q*Math.sin(a));k?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1])}x.stroke()};
  x.font=`11px ${getComputedStyle(el).fontFamily}`;for(let y=1;y<=yrMax;y++){ring(rad(y),rgba(TK.muted,y%5?.16:.34),1);if(y%2===0||y===yrMax){const s=pr(0,0,-rad(y));x.fillStyle=TK.muted;x.textAlign="center";x.fillText(y+" yr",s[0],s[1]-4)}}
  for(let j=3;j>=0;j--){const tt=T-j*.22;if(tt>0&&tt<=yrMax+.8)ring(rad(tt),rgba(TK.accent,j?.28-j*.07:1),j?2:3.5)}
  const c=pr(0,0,0),g=x.createRadialGradient(c[0],c[1],0,c[0],c[1],c[2]*.5);g.addColorStop(0,dark?"#fff":TK.accent);g.addColorStop(.3,rgba(TK.accent,.7));g.addColorStop(1,rgba(TK.accent,0));x.fillStyle=g;x.beginPath();x.arc(c[0],c[1],c[2]*.5,0,7);x.fill();
  let n=0;pos.map(p=>[p,pr(p.x,0,p.z)]).sort((a,b)=>b[1][3]-a[1][3]).forEach(([p,b])=>{const ly=lagY(p.r),on=T>=ly,k=on?easeOut(clamp((T-ly)/.6)):0,hgt=k*(.18+1.9*p.r.coverage_pct/maxCov),top=pr(p.x,hgt,p.z),s=b[2];if(on)n++;
   x.fillStyle=rgba(TK.muted,.7);x.beginPath();x.ellipse(b[0],b[1],s*.07,s*.03,0,0,7);x.fill();
   if(on){x.strokeStyle=TK.data;x.lineWidth=Math.max(4,s*.075);x.lineCap="round";x.shadowColor=TK.data;x.shadowBlur=dark?14:0;x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(top[0],top[1]);x.stroke();x.shadowBlur=0}
   const fs=clamp(s*.17,12,24);x.textAlign="center";x.font=`800 ${fs.toFixed(0)}px ${NATF}`;x.fillStyle=on?TK.text:rgba(TK.muted,.75);x.fillText(nat(p.r.language),top[0],top[1]-fs*.75);
   if(on&&k>.9){x.font=`600 ${Math.max(10.5,fs*.52).toFixed(1)}px ${getComputedStyle(el).fontFamily}`;x.fillStyle=TK.accent;x.fillText(`+${yrs(p.r.median_lag_days)} yrs · ${p.r.coverage_pct}%`,top[0],top[1]-fs*.75-fs*.95)}});
  setT("rp-out","Year "+Math.min(T,yrMax).toFixed(1));setT("rp-n",`${n} of ${L.length} languages reached ·`)});
 return `<section class="wrap"><h1>Something is learned. Then it <em>spreads</em>.</h1><p class="lede">A new topic gets its first Wikipedia article at the centre. The ring is time, moving outward one year per second. Each language stands at its median lag and lights up only when the ring arrives; its column is as tall as the share of topics it covers.</p>${prov()}${ctl("rp",yearNote)}</section>
 <div class="stage" id="rp-st" role="img" aria-label="A 3D field: ${L.length} languages placed at their median coverage lag from the first article, from ${nm(fastest.language)} at ${yrs(fastest.median_lag_days)} years to ${nm(slowest.language)} at ${yrs(slowest.median_lag_days)} years; a ring expands one year per second and lights each language when it arrives."><canvas></canvas></div>
 <section class="wrap"><p class="key">Distance from centre = median_lag_days. Column height = coverage_pct. The direction each language sits in only spreads the names out; it is not geography.</p></section>${dataTable()}${empties()}`},
 pipe(){const n=H.length,STEP=1.3,cur=new Float32Array(M.wikis.length),pts=M.wikis.map((_,k)=>{const q=.19*Math.sqrt(k+.5),a=k*2.399963;return [q*Math.cos(a),q*Math.sin(a)]});
 run("rq",n*STEP,3,n*STEP*.18,(T)=>{const el=document.getElementById("rq-st");if(!el)return;const k=Math.min(n-1,Math.floor(T/STEP)),[x,w,h]=cv(el),pr=cam(w,h,.62,8.4,Math.min(w*1.05,h*1.8),h*.16),dark=st.t==="dark";
  pts.map((p,i)=>{const tg=M.events[i][k]?.06+1.5*Math.log1p(M.events[i][k])/LGC:0;cur[i]=FROZEN?tg:cur[i]+(tg-cur[i])*.14;return [pr(p[0],0,p[1]),pr(p[0],cur[i],p[1]),cur[i]]}).sort((a,b)=>b[0][3]-a[0][3]).forEach(([b,t,v])=>{
   if(v<.01){x.fillStyle=rgba(TK.muted,.45);x.fillRect(b[0]-1,b[1]-1,2,2);return}x.strokeStyle=rgba(TK.data,.35+.65*clamp(v/1.2));x.lineWidth=Math.max(2,b[2]*.03);x.lineCap="round";x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(t[0],t[1]);x.stroke();
   x.fillStyle=TK.accent;x.shadowColor=TK.accent;x.shadowBlur=dark?8:0;x.beginPath();x.arc(t[0],t[1],Math.max(1.4,b[2]*.018),0,7);x.fill();x.shadowBlur=0});
  document.querySelectorAll("#ht tr[data-i]").forEach(r=>r.classList.toggle("cur",+r.dataset.i===k));setT("rq-out",hr(H[k].hour));setT("rq-n",`${fmt(H[k].events)} events · ${wikisAt(k)} of ${M.wikis.length} wikis active ·`)});
 return `<section class="wrap"><h1>${LV.wikis} wikis, <em>rising and falling</em> by the hour.</h1><p class="lede">Every wiki the collector heard from is a point, busiest at the centre. Each hour its column rises to the events measured from that wiki, and falls when it goes quiet.</p>${readouts()}${ctl("rq","replay of "+n+" measured hours")}</section>
 <div class="stage" id="rq-st" style="height:min(62vh,560px)" role="img" aria-label="A 3D field of ${M.wikis.length} points, one per wiki; column height is that wiki's events in the replayed hour (log scale)."><canvas></canvas></div>
 <section class="wrap"><p class="key">Column height = log of events per wiki per hour. Position is by rank (busiest in the middle), not geography.</p>${hourTable()}</section>${engTable()}`}};

/* ===== 3 Red Link ===== */
const words=(r,i,d=0)=>{const n=lit100(r);let s="";for(let k=0;k<100;k++)s+=`<i ${k<n?`class="b" style="--k:${k};--d:${d}ms;`:'style="'}width:${16+((k*37+i*11)%9)*5}px"></i>`;return s};
R.redlink={home(){const z=darkest;let i=0;
 const face=r=>`${natS(r)}<div class="mt" style="margin:2px 0 6px">${nm(r.language)} · <b>${lit100(r)} blue</b>, ${100-lit100(r)} red · ${r.coverage_pct}% covered · median wait ${yrs(r.median_lag_days)} yrs</div><div class="words">${words(r,i,250)}</div>`;
 setTimeout(()=>{const c=document.getElementById("rl-card");if(!c)return;c.innerHTML=face(byCov[0]);if(FROZEN)return;TIMERS.push(setInterval(()=>{if(c.dataset.p==="1")return;c.classList.add("out");setTimeout(()=>{i=(i+1)%byCov.length;c.innerHTML=face(byCov[i]);c.setAttribute("aria-label",`${nm(byCov[i].language)}: ${lit100(byCov[i])} of 100 links are blue`);c.classList.remove("out")},330)},5200));
  const pp=document.getElementById("rl-pp");if(pp)pp.onclick=()=>{c.dataset.p=c.dataset.p==="1"?"0":"1";pp.textContent=c.dataset.p==="1"?"Play":"Pause"};const re=document.getElementById("rl-re");if(re)re.onclick=()=>render()},0);
 return `<section class="wrap"><div class="hero"><div><h1>In ${nm(z.language)} Wikipedia, <em>${100-lit100(z)} of every 100</em> shared topics are still a red link.</h1>
 <p class="lede">On Wikipedia a <span class="lk">blue link</span> leads to an article. A <span class="rl">red link</span> means nobody has written it yet in that language. Every language starts as 100 red links, one for each 1% of the topics the followed languages share, and the ones it has written turn over to blue.</p>${prov()}
 <div class="ctl">${FROZEN?"":`<button type="button" id="rl-re">Replay</button><button type="button" id="rl-pp">Pause</button>`}<span>The card turns to the next language every five seconds.</span></div></div>
 <div class="persp"><div class="card" id="rl-card" role="img"></div></div></div></section>
 <section class="wrap"><h2>All ${L.length} languages</h2><div class="paras">${byCov.map((r,j)=>`<div class="para"><h3>${natS(r)} <span class="mt">${nm(r.language)} · <b>${lit100(r)} blue</b>, ${100-lit100(r)} red · ${r.coverage_pct}% covered · median wait ${yrs(r.median_lag_days)} yrs</span></h3><div class="words" role="img" aria-label="${nm(r.language)}: ${lit100(r)} of 100 links are blue (covered), ${100-lit100(r)} are red (missing).">${words(r,j,600+j*120)}</div></div>`).join("")}</div>
 <p class="key">Blue (solid) = covered; red (dashed) = missing. Blue count = coverage_pct rounded to a whole link; the exact value is printed. Each link flips once, when the page loads. Word lengths are decoration.</p></section>${empties()}`},
 pipe(){const n=H.length,STEP=1.6,W=String(maxH).length;
 run("ro",n*STEP,3,n*STEP*.2,(T)=>{const k=Math.min(n-1,Math.floor(T/STEP)),s=String(H[k].events).padStart(W," ");document.querySelectorAll("#ro .dg span").forEach((d,j)=>d.style.setProperty("--n",s[j]===" "?10:+s[j]));
  document.querySelectorAll("#ht tr[data-i]").forEach(r=>r.classList.toggle("cur",+r.dataset.i===k));setT("ro-out",hr(H[k].hour));setT("ro-n",`${wikisAt(k)} wikis active · ${fmt(H[k].new_articles)} new articles ·`)});
 return `<section class="wrap"><h1>Recent changes, <em>counted</em>.</h1><p class="lede">Wikipedia's "Recent changes" page lists every edit as it happens. This counter turns to the number of events the collector measured in each hour, across ${LV.wikis} wikis.</p>
 <div class="odo" id="ro" role="img" aria-label="Events in the replayed hour">${Array.from({length:W},(_,j)=>`<div class="dg"><span style="--n:10">${"0123456789".split("").map(c=>`<b>${c}</b>`).join("")}<b>&nbsp;</b></span></div>${(W-1-j)%3===0&&j<W-1?'<div class="sep">,</div>':""}`).join("")}</div>
 ${ctl("ro","events in the hour · replay of "+n+" measured hours")}${readouts()}</section>
 <section class="wrap">${hourTable()}</section>${engTable()}`}};

// ---------- chrome + render ----------
function btn(g,key,val,label){const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",st[key]===val);b.onclick=()=>{st[key]=val;render()};document.getElementById(g).appendChild(b)}
function chrome(){["g-c","g-v","g-t","g-l"].forEach(g=>document.querySelectorAll(`#${g} button`).forEach(b=>b.remove()));
 CONCEPTS.forEach((c,i)=>btn("g-c","c",c.id,`${i+1} ${c.name}`));btn("g-v","v","home","Home (Now)");btn("g-v","v","pipeline","Pipeline Live");
 btn("g-t","t","light","Light");btn("g-t","t","dark","Dark");LOGO_KEYS.forEach(k=>btn("g-l","l",k,k[0].toUpperCase()+" "+k.slice(2)));
 const c=CONCEPTS.find(x=>x.id===st.c);document.getElementById("chrome-note").textContent=`${c.name}: ${c.tag} Every number comes from the sample export copies in sample-data/.`}
function render(){cancelAnimationFrame(RAF);TIMERS.forEach(clearInterval);TIMERS=[];RUNS=[];if(!R[st.c])st.c="tower";if(!LOGOS[st.l])st.l=LOGO_KEYS[0];
 const s=document.getElementById("site");TK=PAL[st.c][st.t];document.documentElement.dataset.theme=st.t;
 s.className="c-"+st.c+(FROZEN?" still":"");s.dataset.t=st.t;Object.entries(TK).forEach(([k,v])=>s.style.setProperty("--"+k,v));s.style.colorScheme=st.t;
 s.innerHTML=header(st.v==="home"?"Now":"Pipeline Live")+R[st.c][st.v==="home"?"home":"pipe"]()+footer();
 history.replaceState(null,"",`#c=${st.c}&v=${st.v}&t=${st.t}&l=${st.l}${+st.shot?"&shot=1":""}`);chrome();
 if(FROZEN){requestAnimationFrame(frame);document.fonts.ready.then(()=>requestAnimationFrame(frame))}else RAF=requestAnimationFrame(frame)}
addEventListener("resize",()=>{if(FROZEN)requestAnimationFrame(frame)});
render();
</script>
</body>
</html>
