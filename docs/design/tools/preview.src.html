<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babel Lag design preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Unbounded:wght@400;700&family=Anton&family=Archivo:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,800&family=Work+Sans:wght@400;600&family=Noto+Sans:wght@500;800&family=Noto+Sans+Devanagari:wght@500;800&family=Noto+Sans+Bengali:wght@500;800&family=Noto+Sans+Ethiopic:wght@500;800&family=Noto+Sans+Gurmukhi:wght@500;800&family=Noto+Sans+Tamil:wght@500;800&family=Noto+Sans+Telugu:wght@500;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* ---------- preview chrome (neutral; not part of any concept) ---------- */
:root{--cb:#f4f4f5;--cf:#18181b;--cm:#52525b;--ca:#1d4ed8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cb:#18181b;--cf:#f4f4f5;--cm:#a1a1aa;--ca:#93c5fd}}
:root[data-theme="dark"]{--cb:#18181b;--cf:#f4f4f5;--cm:#a1a1aa;--ca:#93c5fd}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cb);color:var(--cf);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
#chrome{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:var(--cb);border-bottom:1px solid color-mix(in srgb,var(--cf) 18%,transparent)}
#chrome b{font-size:13px}
#chrome .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#chrome .grp>span{color:var(--cm);font-size:12px;margin-right:2px}
#chrome button{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:6px;border:1px solid color-mix(in srgb,var(--cf) 30%,transparent);background:transparent;color:var(--cf);cursor:pointer}
#chrome button[aria-pressed="true"]{background:var(--cf);color:var(--cb);border-color:var(--cf)}
#chrome button:focus-visible,#site :focus-visible{outline:3px solid var(--ca);outline-offset:2px}
#chrome .note{color:var(--cm);font-size:12px;flex-basis:100%}
body.shot #chrome{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shared skeleton ---------- */
#site{--bg:#fff;--surface:#fff;--text:#000;--muted:#444;--accent:#00f;--data:#00f;--dim:#ccc;
  background:var(--bg);color:var(--text);min-height:100vh;font-family:var(--font-body);overflow-x:clip}
#site a{color:var(--accent)}
#site .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
#site header.top{display:flex;align-items:center;gap:10px 18px;padding:14px 16px;flex-wrap:wrap;max-width:1180px;margin:0 auto;position:relative;z-index:3}
#site .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:21px;text-decoration:none;color:var(--text)}
#site .brand svg{width:34px;height:34px}
#site nav ul{display:flex;flex-wrap:wrap;gap:2px 14px;list-style:none;margin:0;padding:0;font-size:13px}
#site nav a{color:var(--muted);text-decoration:none}
#site nav a[aria-current]{color:var(--text);font-weight:600;border-bottom:2px solid var(--accent)}
#site .ink{fill:var(--text)} #site .lit{fill:var(--accent)} #site .off{fill:var(--text);opacity:.22}
#site .st{stroke:var(--text)} #site .stl{stroke:var(--accent)}
#site h1,#site h2{font-family:var(--font-head);line-height:1.02;margin:0 0 .35em}
#site h2{font-size:clamp(20px,2.6vw,30px)}
#site .lede{font-size:clamp(15px,1.6vw,19px);color:var(--muted);max-width:60ch}
#site .muted{color:var(--muted)} #site .small{font-size:12.5px}
#site .src{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
#site section{padding:22px 0}
#site .key{font-size:12.5px;color:var(--muted);margin-top:8px}
#site .empty{border:1.5px dashed var(--muted);padding:14px 16px;color:var(--muted);font-size:13.5px}
#site .empty b{color:var(--text)}
#site .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
#site footer{border-top:1px solid var(--dim);margin-top:24px;padding:18px 0 34px;font-size:12.5px;color:var(--muted)}
#site svg text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
#site .replay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#site .replay button{font:inherit;padding:3px 10px;border:1px solid var(--muted);background:transparent;color:var(--text);cursor:pointer;border-radius:4px}
#site .scroll{overflow-x:auto}
#site .nat{font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI","Ebrima",sans-serif}
#site .engines{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
#site .engines .on{color:var(--text);font-weight:600} #site .engines .no{color:var(--muted)}
#site details.data{font-size:13px;margin-top:8px} #site details.data summary{cursor:pointer;color:var(--accent)}
#site details.data table{border-collapse:collapse;width:100%;margin-top:8px} #site details.data td,#site details.data th{padding:4px 8px;border-bottom:1px solid var(--dim);text-align:left}
#site details.data .r{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 3D scroll scenes ---------- */
#site .scene{position:relative;height:calc(var(--vh)*1vh);padding:0}
#site .scene>.stick{position:sticky;top:0;height:100vh;overflow:hidden}
#site .scene.frozen{height:auto}
#site .scene.frozen>.stick{position:relative;height:720px}
#site .scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#site .hud{position:absolute;left:0;right:0;bottom:22px;z-index:4;pointer-events:none}
#site .hud .wrap>b{display:block;font-family:var(--font-head);font-size:clamp(20px,2.8vw,34px);line-height:1.1;color:var(--text)}
#site .hud .wrap>span{font-size:13px;color:var(--muted)}
#site .hud-top{position:absolute;left:0;right:0;top:18px;z-index:4;pointer-events:none}
#site .hint{position:absolute;right:18px;bottom:20px;z-index:5;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
#site .bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);z-index:5;width:calc(var(--p,0)*100%)}
/* CSS 3D box */
#site .bx{position:absolute;left:0;top:0;transform-style:preserve-3d}
#site .bx i{position:absolute;left:0;top:0}
#site .bx .fr,#site .bx .bk{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2)}
#site .bx .lf,#site .bx .rt{width:var(--d);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--d)/-2)}
#site .bx .tp{width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2)}
#site .bx .fr{transform:translateZ(calc(var(--d)/2));background:color-mix(in srgb,var(--c) 86%,#000)}
#site .bx .bk{transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:color-mix(in srgb,var(--c) 62%,#000)}
#site .bx .rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:color-mix(in srgb,var(--c) 70%,#000)}
#site .bx .lf{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:color-mix(in srgb,var(--c) 78%,#000)}
#site .bx .tp{transform:rotateX(90deg) translateZ(calc(var(--h)/2));background:color-mix(in srgb,var(--c) 72%,#fff)}

/* ===== 1 Blackout ===== */
.c-blackout{--font-head:"Big Shoulders Display",Impact,sans-serif;--font-body:"Inter",system-ui,sans-serif}
.c-blackout h1{font-size:clamp(44px,9vw,128px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.c-blackout h1 em{font-style:normal;color:var(--accent)}
.c-blackout .word{font-weight:800;line-height:1.12;color:transparent;-webkit-background-clip:text;background-clip:text;white-space:nowrap}
.c-blackout .wall .word{font-size:clamp(34px,6.4vw,84px)}
.c-blackout .wl{display:flex;align-items:baseline;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;border-top:1px solid var(--dim);padding:2px 0}
.c-blackout .m{font-family:var(--font-head);font-size:clamp(14px,1.6vw,19px);font-weight:500;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.c-blackout .m b{color:var(--accent);font-weight:800}
.c-blackout .tun{position:absolute;inset:0;perspective:900px;perspective-origin:50% 45%}
.c-blackout .tun-cam{position:absolute;left:50%;top:48%;transform-style:preserve-3d}
.c-blackout .tw{position:absolute;left:0;top:0;translate:-50% -50%;text-align:center;will-change:transform,opacity}
.c-blackout .tw .word{display:block;font-size:clamp(70px,13vw,190px)}
.c-blackout .tw .m{display:block}
.c-blackout .giant{font-family:var(--font-head);font-weight:900;font-size:clamp(56px,11vw,150px);line-height:.9;color:var(--accent);margin-bottom:18px}
.c-blackout .giant small{display:block;font-size:clamp(14px,1.6vw,19px);font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.c-blackout .scene>.stick{background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--accent) 7%,var(--bg)),var(--bg) 70%)}

/* ===== 2 Departures ===== */
.c-departures{--font-head:"Space Mono",ui-monospace,monospace;--font-body:"Inter",system-ui,sans-serif}
.c-departures h1{font-size:clamp(28px,4.6vw,56px);font-weight:700;letter-spacing:-.03em}
.c-departures .tilt{perspective:1300px;perspective-origin:50% -10%}
.c-departures .boardw{background:#0A0A0B;border-radius:10px;padding:14px;overflow-x:auto;transform-origin:50% 0;box-shadow:0 16px 0 -4px #000,0 40px 70px rgba(0,0,0,.45);will-change:transform}
.c-departures .bh{display:grid;grid-template-columns:var(--cols);gap:12px;color:#FFC400;font:700 11px/1 var(--font-head);letter-spacing:.12em;text-transform:uppercase;padding:0 0 8px}
.c-departures .br{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:3px 0}
.c-departures .fl{display:flex;gap:2px;perspective:300px}
.c-departures .fl span{position:relative;display:inline-block;width:1.05em;height:1.55em;text-align:center;background:linear-gradient(#1F1F23 0 50%,#16161A 50%);color:#F4F4F4;font:700 clamp(12px,1.35vw,17px)/1.55em var(--font-head);border-radius:3px;text-transform:uppercase;transform-origin:50% 50%}
.c-departures .go .fl span,.c-departures .fl.now span{animation:flip .55s cubic-bezier(.3,1.5,.6,1) both;animation-delay:calc(var(--i)*22ms)}
.c-departures .boardw:not(.go) .fl span{transform:rotateX(-90deg);opacity:.15}
.c-departures .fl span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.c-departures .fl.hi span{color:#FFC400}
.c-departures .fl.nat span{width:auto;min-width:1.05em;padding:0 .3em;text-transform:none;font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Ethiopic","Noto Sans Gurmukhi","Noto Sans Tamil","Noto Sans Telugu","Noto Naskh Arabic","Nirmala UI",sans-serif}
@keyframes flip{0%{transform:rotateX(-100deg);opacity:.2}60%{transform:rotateX(12deg)}100%{transform:none;opacity:1}}
.c-departures .module{display:inline-block;transform:perspective(900px) rotateX(14deg) rotateY(-16deg);transform-style:preserve-3d;background:#0A0A0B;border-radius:14px;padding:18px 20px;box-shadow:10px 18px 0 -2px #000,0 50px 80px rgba(0,0,0,.5)}
.c-departures .module .k{color:#FFC400;font:700 11px var(--font-head);letter-spacing:.14em;text-transform:uppercase;margin:6px 0 4px}
.c-departures .module .fl span{font-size:clamp(18px,3vw,34px)}
.c-departures .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
@media (max-width:820px){.c-departures .hero{grid-template-columns:1fr}.c-departures .module{transform:none}}
.c-departures .clock{display:flex;gap:18px;flex-wrap:wrap}
.c-departures .clock>div{background:#0A0A0B;border-radius:10px;padding:12px 14px;transform:perspective(600px) rotateX(10deg)}
.c-departures .clock .k{color:#C9C9CF;font:700 11px var(--font-head);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}

/* ===== 3 Seismograph ===== */
.c-seismograph{--font-head:"IBM Plex Serif",Georgia,serif;--font-body:"IBM Plex Mono",ui-monospace,monospace}
.c-seismograph h1{font-size:clamp(32px,5.6vw,72px);font-weight:400;font-style:italic;max-width:16ch}
.c-seismograph .scene>.stick{background-color:var(--surface);background-image:linear-gradient(var(--dim) 1px,transparent 1px),linear-gradient(90deg,var(--dim) 1px,transparent 1px);background-size:28px 28px}
.c-seismograph .mag{font-family:var(--font-head);font-size:clamp(48px,8vw,104px);line-height:1;color:var(--data)}

/* ===== 4 Light-years ===== */
.c-lightyears{--font-head:"Unbounded",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif}
.c-lightyears h1{font-size:clamp(28px,4.8vw,62px);font-weight:700;letter-spacing:-.02em;max-width:18ch}
.c-lightyears h1 em{font-style:normal;color:var(--accent)}
.c-lightyears .scene>.stick{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--data) 10%,var(--bg)),var(--bg) 75%)}

/* ===== 5 Riso ===== */
.c-riso{--font-head:"Anton",Impact,sans-serif;--font-body:"Archivo",system-ui,sans-serif;--ink1:#FF48B0;--ink2:#0078BF;--blend:multiply}
.c-riso[data-t="dark"]{--blend:screen}
.c-riso h1{font-size:clamp(40px,7vw,96px);font-weight:400;text-transform:uppercase;line-height:.92}
.c-riso .blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.c-riso .blobs i{position:absolute;border-radius:50%;mix-blend-mode:var(--blend);opacity:.18;will-change:transform}
.c-riso .wrap,.c-riso header,.c-riso footer{position:relative;z-index:1}
.c-riso .poster{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center}
.c-riso .huge{position:relative;font-family:var(--font-head);font-size:clamp(120px,26vw,340px);line-height:.8;letter-spacing:-.02em;transform-style:preserve-3d;will-change:transform}
.c-riso .huge span{display:block;mix-blend-mode:var(--blend);will-change:transform}
.c-riso .huge .a{color:var(--ink1)}
.c-riso .huge .b{position:absolute;inset:0;color:var(--ink2)}
.c-riso .stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.c-riso .stamp{border:2px solid var(--text);padding:8px;background:var(--surface);will-change:transform;transform-origin:50% 100%}
.c-riso .stamp .code{font-family:var(--font-head);font-size:34px;line-height:1;text-transform:uppercase}
.c-riso .stamp svg{display:block;width:100%;height:auto}
.c-riso .stamp svg g{mix-blend-mode:var(--blend)}
.c-riso .stamp svg circle,.c-riso #hb circle{transform-box:fill-box;transform-origin:center;transform:scale(var(--k,1))}
.c-riso h2{margin-top:14px}
.c-riso .tag{display:inline-block;font-family:var(--font-head);text-transform:uppercase;border:2.5px solid currentColor;padding:2px 8px;transform:rotate(-3deg);margin:4px 6px 4px 0}
.c-riso .tag.on{color:var(--accent)} .c-riso .tag.no{color:var(--muted);transform:rotate(2deg);border-style:dashed}
@media (max-width:700px){.c-riso .poster{grid-template-columns:1fr}}

/* ===== 6 Babel Tower ===== */
.c-tower{--font-head:"Fraunces",Georgia,serif;--font-body:"Work Sans",system-ui,sans-serif}
.c-tower h1{font-size:clamp(34px,6vw,80px);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.c-tower .scene>.stick{background:linear-gradient(180deg,color-mix(in srgb,var(--data) 16%,var(--bg)),var(--bg) 75%)}
.c-tower .stage3d{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 30%}
.c-tower .world{position:absolute;left:50%;top:66%;transform-style:preserve-3d;will-change:transform}
.c-tower .ground{position:absolute;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;transform:rotateX(90deg);background:radial-gradient(circle,color-mix(in srgb,var(--text) 14%,transparent),transparent 60%)}
.c-tower .fl3{position:absolute;left:0;top:0;transform-style:preserve-3d;transition:opacity .2s}

@media (prefers-reduced-motion:reduce){#site *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="chrome" role="toolbar" aria-label="Preview controls">
  <b>Babel Lag design gate</b>
  <div class="grp" id="g-c"><span>Concept</span></div>
  <div class="grp" id="g-v"><span>Page</span></div>
  <div class="grp" id="g-t"><span>Theme</span></div>
  <div class="grp" id="g-l"><span>Logo</span></div>
  <div class="note" id="chrome-note"></div>
</div>
<main id="site"></main>
<script>
"use strict";
const D=/*__DATA__*/null, PAL=/*__PALETTES__*/null, LOGOS=/*__LOGOS__*/null;
const CONCEPTS=[
 {id:"blackout",name:"Blackout",tag:"Fly through a dark tunnel of language names, each lit only as far as its coverage reaches; a 3D globe of 523 wikis lights up hour by hour."},
 {id:"departures",name:"Departures",tag:"A 3D split-flap board that swings upright as you scroll and flips to the measured delays."},
 {id:"seismograph",name:"Seismograph",tag:"Scroll is time: a 3D ridgeline where each language's needle jumps only when the median topic arrives; a rotating drum of live hours."},
 {id:"lightyears",name:"Light-years",tag:"A 3D solar system: languages orbit at their lag in years, their lit crescent is coverage; a terrain of 523 wikis' live signal."},
 {id:"riso",name:"Riso Manifesto",tag:"A two-ink poster that snaps into register as you scroll; 3D stamps fall into place and print their halftone."},
 {id:"tower",name:"Babel Tower",tag:"A turning 3D tower built floor by floor as you scroll, each floor as wide as its language's coverage."}];
const NAMES={am:["Amharic","አማርኛ"],bn:["Bengali","বাংলা"],cy:["Welsh","Cymraeg"],el:["Greek","Ελληνικά"],eo:["Esperanto","Esperanto"],ha:["Hausa","Hausa"],hi:["Hindi","हिन्दी"],ig:["Igbo","Igbo"],mr:["Marathi","मराठी"],ms:["Malay","Melayu"],ne:["Nepali","नेपाली"],pa:["Punjabi","ਪੰਜਾਬੀ"],so:["Somali","Soomaali"],sw:["Swahili","Kiswahili"],ta:["Tamil","தமிழ்"],te:["Telugu","తెలుగు"],tl:["Tagalog","Tagalog"],ur:["Urdu","اردو"],yo:["Yoruba","Yorùbá"],zu:["Zulu","isiZulu"]};
const RTL=new Set(["ur"]);
const NAV=["Now","Languages","Topics","Backtests","Pipeline Live","Lineage","Catalog","Method and data","How it's built","The maker","Corrections"];
const LOGO_KEYS=Object.keys(LOGOS);
const st={c:"blackout",v:"home",t:"dark",l:LOGO_KEYS[0],paused:false,shot:0};
location.hash.slice(1).split("&").forEach(p=>{const [k,v]=p.split("=");if(k in st&&v)st[k]=decodeURIComponent(v)});
if(+st.shot)document.body.classList.add("shot");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FROZEN=reduced||+st.shot; // frozen: no sticky scroll, no ambient motion; each scene drawn once at a fixed frame

// ---------- display helpers (formatting only; no new numbers) ----------
const fmt=n=>n==null?"not measured":Number(n).toLocaleString("en-US");
const fmt1=n=>n==null?"not measured":Number(n).toLocaleString("en-US",{maximumFractionDigits:1});
const yrs=d=>(d/365.25).toLocaleString("en-US",{maximumFractionDigits:1});
const day=s=>s?s.slice(0,16).replace("T"," ")+" UTC":"n/a";
const hr=s=>s.slice(5,13).replace("T"," ")+"h";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=p=>`<span class="src">${esc(p)}</span>`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const L=D.languages.rows.slice(), P=D.pipeline, LV=D.live, H=LV.hourly, M=LV.matrix;
const byCov=L.slice().sort((a,b)=>b.coverage_pct-a.coverage_pct), byLag=L.slice().sort((a,b)=>a.median_lag_days-b.median_lag_days);
const maxCov=Math.max(...L.map(r=>r.coverage_pct)), maxLag=Math.max(...L.map(r=>r.median_lag_days)), yrMax=Math.ceil(maxLag/365.25);

function flap(s,n,cls=""){s=String(s);if(cls.includes("nat"))return `<span class="fl ${cls}" aria-hidden="true"><span style="--i:0">${esc(s)}</span></span>`;if(n)s=s.padEnd(n).slice(0,n);return `<span class="fl ${cls}" aria-hidden="true">${[...s].map((c,i)=>`<span style="--i:${i}">${c===" "?"&nbsp;":esc(c)}</span>`).join("")}</span>`}

R.departures={home(){const cols="minmax(150px,1.3fr) minmax(120px,1fr) minmax(140px,1fr) minmax(90px,.7fr)",seq=byLag.slice().reverse();

/* ===== 3 Seismograph ===== */
R.seismograph={home(){
 const ridge=scene("se-r",420,`<canvas></canvas>${hud("se",true)}`,`Scroll moves time forward; each language's trace spikes at its median coverage lag. The same data is in the table below.`,(p,t,el)=>{
  const [x,w,h]=cv(el),Y=p*yrMax*1.03,pr=cam(w,h,-.22+.05*Math.sin(t*.25)+p*.12,lerp(1.3,.5,ease(p)),4.6,Math.min(w*.95,h*1.5),30);
  const xs=v=>-1.8+3.6*v/yrMax,zi=i=>(i-(L.length-1)/2)*.17,n=L.length;
  x.lineWidth=1;x.font="11px "+getComputedStyle(el).fontFamily;
  for(let y=0;y<=yrMax;y++){const a=pr(xs(y),0,zi(0)-.12),b=pr(xs(y),0,zi(n-1)+.12);x.strokeStyle=rgba(TK.muted,.3);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.fillStyle=TK.muted;x.fillText(y+"y",a[0]-6,a[1]+14)}
  let moved=0;for(let i=n-1;i>=0;i--){const r=byLag[i],lagY=r.median_lag_days/365.25,A=.06+.34*r.coverage_pct/maxCov,end=Math.min(Y,yrMax),pts=[];
   for(let k=0;k<=160;k++){const v=end*k/160,s=(v-lagY)/.1,yy=Y>=lagY&&Math.abs(s)<6?A*Math.exp(-s*s/4)*Math.cos(s*2.4):0;pts.push(pr(xs(v),yy,zi(i)))}
   const b0=pr(xs(0),0,zi(i)),b1=pr(xs(end),0,zi(i));x.fillStyle=rgba(TK.surface,.9);x.beginPath();x.moveTo(b0[0],b0[1]);pts.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(b1[0],b1[1]);x.closePath();x.fill();
   const hit=Y>=lagY;if(hit)moved++;x.strokeStyle=rgba(TK.data,hit?1:.55);x.lineWidth=hit?1.8:1.2;x.beginPath();pts.forEach((q,k)=>k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();
   x.fillStyle=TK.text;x.textAlign="right";x.fillText(nm(r.language),b0[0]-8,b0[1]+4);x.textAlign="left";
   if(hit){const tp=pr(xs(lagY),A,zi(i));x.fillStyle=TK.data;x.fillText(yrs(r.median_lag_days),tp[0]+6,tp[1]-2)}}
  const c0=pr(xs(Math.min(Y,yrMax)),0,zi(0)-.2),c1=pr(xs(Math.min(Y,yrMax)),0,zi(n-1)+.2);x.strokeStyle=TK.accent;x.lineWidth=2;x.beginPath();x.moveTo(c0[0],c0[1]);x.lineTo(c1[0],c1[1]);x.stroke();
  setT("se-h",`Year ${Math.min(Y,yrMax).toFixed(1)} after a topic's first article`);setT("se-s",`${moved} of ${n} needles have moved (median topic arrived). Spike position = median lag; height = coverage.`)},.82);
 return `<section class="wrap"><h1>Every new thing is a tremor. Some needles never move.</h1><p class="lede">A topic's first Wikipedia article is the quake. Scroll to move time forward: each language's needle stays flat until the median topic arrives there.</p>${prov()}</section>
 ${ridge}<section class="wrap"><p class="key">Spike position = median_lag_days. Spike height = coverage_pct. The wiggle shape is a marker, not data.</p>${dataTable()}</section>
 <section class="wrap">${empties()}</section>`},
 pipe(){let A=null;HOOK=i=>{HOUR=i;setT("rp",hr(H[i].hour)+" UTC");setT("sp-h",fmt(H[i].events)+" events");setT("sp-s",`in the hour ${hr(H[i].hour)} UTC, across ${LV.wikis} wikis`)};
 const drum=scene("sp-d",240,`<canvas></canvas>${hud("sp")}`,`A rotating drum: one ridge per measured hour, height = events in that hour.`,(p,t,el)=>{
  const [x,w,h]=cv(el),n=H.length,R0=.85,target=-HOUR/n*Math.PI*2;if(A==null||FROZEN)A=target;let d=target-A;d=Math.atan2(Math.sin(d),Math.cos(d));A+=d*.08;
  const pr=cam(w,h,.7-.3*p,.28+.12*p,5.2,Math.min(w,h)*.75,-40),q=[];
  for(let i=0;i<n;i++){const th=i/n*Math.PI*2+A,Lh=.06+.6*H[i].events/maxH,c=Math.cos(th);if(c<-.15)continue;const dt=Math.PI/n*.8,r=R0+Lh;
   const P4=[[-1.3,th-dt],[1.3,th-dt],[1.3,th+dt],[-1.3,th+dt]].map(([ax,a])=>pr(ax,r*Math.sin(a),-r*Math.cos(a)));q.push([P4,c,i])}
  x.strokeStyle=rgba(TK.text,.25);for(const ax of[-1.3,1.3]){x.beginPath();for(let k=0;k<=60;k++){const a=k/60*Math.PI*2,s=pr(ax,R0*Math.sin(a),-R0*Math.cos(a));k?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1])}x.stroke()}
  q.sort((a,b)=>a[1]-b[1]).forEach(([P4,c,i])=>{x.fillStyle=i===HOUR?TK.accent:rgba(TK.data,.25+.65*clamp(c));x.beginPath();P4.forEach((s,k)=>k?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1]));x.closePath();x.fill()});
  const n0=pr(0,0,-(R0+.75)),n1=pr(0,0,-(R0+.05));x.strokeStyle=TK.text;x.lineWidth=2;x.beginPath();x.moveTo(n0[0],n0[1]-60);x.lineTo(n1[0],n1[1]);x.stroke();x.lineWidth=1},.5);
 return `<section class="wrap"><h1>The drum never stops turning.</h1><p class="lede">The live stream as a drum: one ridge per measured hour; the drum turns to the hour being replayed.</p>${replayCtl()}</section>
 ${drum}
 <section class="wrap"><div class="row2"><div><div class="mag">${fmt1(P.live.events_per_second)}/s</div><div class="key">events per second, last window ${src("live.events_per_second")}</div></div>
 <div><div class="mag">${fmt1(P.live.end_to_end_latency_s)}s</div><div class="key">event time to published table ${src("live.end_to_end_latency_s")}</div></div></div></section>
 <section class="wrap"><h2>Instruments</h2>${engines()}</section>`}};

/* ===== 4 Light-years ===== */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const STARS=Array.from({length:420},()=>{const u=rnd()*2-1,f=rnd()*6.283,r=Math.sqrt(1-u*u);return [Math.cos(f)*r*30,u*30,Math.sin(f)*r*30,rnd()]});
function phase(x,cx,cy,r,f,ang){x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=TK.dim;x.strokeStyle=rgba(TK.muted,.7);x.lineWidth=.8;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.stroke();
 if(f>0){const k=Math.abs(1-2*f)*r;x.fillStyle=TK.accent;x.beginPath();x.arc(0,0,r,-Math.PI/2,Math.PI/2,false);x.ellipse(0,0,k,r,0,Math.PI/2,-Math.PI/2,f<.5);x.fill()}x.restore()}
R.lightyears={home(){const rad=d=>.35+2.6*d/maxLag;
 const sys=scene("ly-scn",420,`<canvas></canvas>${hud("ly")}`,`A 3D solar system: each language orbits at its median coverage lag; its lit crescent is its coverage share.`,(p,t,el)=>{
  const [x,w,h]=cv(el),e=ease(p),pr=cam(w,h,t*.05+p*1.6,lerp(.12,.9,e),lerp(1.7,6.4,e),Math.min(w,h)*.95);x.font="12px "+getComputedStyle(el).fontFamily;
  for(const [a,b,c,k] of STARS){const s=pr(a,b,c);if(s[3]<.1)continue;x.fillStyle=rgba(TK.text,.25+.5*k);x.fillRect(s[0],s[1],1+k,1+k)}
  for(let y=1;y<=yrMax;y++){const rr=rad(y*365.25);x.strokeStyle=rgba(TK.muted,y%5?.18:.4);x.beginPath();for(let k=0;k<=96;k++){const a=k/96*6.283,s=pr(rr*Math.cos(a),0,rr*Math.sin(a));k?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1])}x.stroke();
   if(y%2===0){const s=pr(rr,0,0);x.fillStyle=TK.muted;x.fillText(y+" yr",s[0]+4,s[1]-4)}}
  const sun=pr(0,0,0),g=x.createRadialGradient(sun[0],sun[1],0,sun[0],sun[1],sun[2]*.45);g.addColorStop(0,TK.accent);g.addColorStop(.25,rgba(TK.accent,.6));g.addColorStop(1,rgba(TK.accent,0));x.fillStyle=g;x.beginPath();x.arc(sun[0],sun[1],sun[2]*.45,0,7);x.fill();
  L.map((r,i)=>{const a=i*2.399963+.4,rr=rad(r.median_lag_days);return [pr(rr*Math.cos(a),0,rr*Math.sin(a)),r]}).sort((a,b)=>b[0][3]-a[0][3]).forEach(([[sx,sy,s],r])=>{
   const pr0=Math.max(4,s*.075);phase(x,sx,sy,pr0,r.coverage_pct/100,Math.atan2(sun[1]-sy,sun[0]-sx));x.fillStyle=TK.text;x.fillText(nm(r.language),sx+pr0+5,sy+4)});
  setT("ly-h",`${nm(slowest.language)} orbits ${yrs(slowest.median_lag_days)} light-years of lag out`);setT("ly-s",`Rings = years of median coverage lag · lit crescent = coverage share (largest: ${nm(byCov[0].language)} ${byCov[0].coverage_pct}%)`)},.62);
 return `<section class="wrap"><h1>In ${nm(slowest.language)}, new knowledge arrives <em>${yrs(slowest.median_lag_days)} years</em> after it is born.</h1>
 <p class="lede">Light from the first article travels outward. Scroll to pull the camera back from the sun: each planet orbits at its median coverage lag, and its lit crescent is the share of topics that have reached it.</p>${prov()}</section>
 ${sys}<section class="wrap"><p class="key">Orbit radius = median_lag_days; lit phase = coverage_pct of a full disc, facing the source. Orbit angles only spread the planets out. Most are nearly new moons; that is the finding. Background stars are decoration, not data.</p>${dataTable()}</section>
 <section class="wrap">${empties()}</section>`},
 pipe(){const cols=40,rows=H.length;HOOK=i=>{HOUR=i;setT("rp",hourText(i));setT("lp-h",hourText(i));setT("lp-s",`terrain = log events per wiki per hour, ${cols} busiest wikis`)};
 const terr=scene("lp-t",260,`<canvas></canvas>${hud("lp")}`,`A 3D terrain of measured events: ${cols} busiest wikis by ${rows} hours.`,(p,t,el)=>{
  const [x,w,h]=cv(el),pr=cam(w,h,.35+.12*Math.sin(t*.15)+p*.5,lerp(1.0,.55,ease(p)),5,Math.min(w,h)*.85,10),gx=c=>(c/(cols-1)-.5)*3.4,gz=i=>(i/(rows-1)-.5)*2.6,gy=(c,i)=>Math.log1p(M.events[c][i])/LGC*.9;
  for(let c=0;c<cols;c+=1){x.strokeStyle=rgba(TK.data,.18);x.beginPath();for(let i=0;i<rows;i++){const s=pr(gx(c),gy(c,i),gz(i));i?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1])}x.stroke()}
  for(let i=0;i<rows;i++){const cur=i===HOUR;x.strokeStyle=cur?TK.accent:rgba(TK.data,.55);x.lineWidth=cur?2.6:1;x.beginPath();for(let c=0;c<cols;c++){const s=pr(gx(c),gy(c,i),gz(i));c?x.lineTo(s[0],s[1]):x.moveTo(s[0],s[1])}x.stroke()}x.lineWidth=1;
  x.fillStyle=TK.muted;x.font="10px sans-serif";for(let c=0;c<cols;c+=6){const s=pr(gx(c),0,gz(0)-.15);x.fillText(M.wikis[c].replace(/wiki$/,""),s[0]-10,s[1]+12)}},.55);
 return `<section class="wrap"><h1>Listening to <em>${LV.wikis}</em> wikis.</h1><p class="lede">A radio-telescope terrain: each ridge is a measured hour, each column one of the ${cols} busiest wikis, height the event count. The bright ridge is the hour being replayed.</p>${replayCtl()}</section>
 ${terr}
 <section class="wrap"><div class="row2"><div><h2 style="color:var(--accent)">${fmt1(P.live.events_per_second)} events/s</h2><span class="key">last window ${src("live.events_per_second")}</span></div><div><h2>${fmt1(P.live.end_to_end_latency_s)} s</h2><span class="key">light-time from event to table ${src("live.end_to_end_latency_s")}</span></div></div></section>
 <section class="wrap"><h2>Instruments</h2>${engines()}</section>`}};

/* ===== 5 Riso ===== */
function halftone(f){const n=7,c=100/n;let a="",b="";for(let i=0;i<n;i++)for(let j=0;j<n;j++){const r=(c/2-.6)*Math.sqrt(f);a+=`<circle cx="${(i*c+c/2).toFixed(1)}" cy="${(j*c+c/2).toFixed(1)}" r="${r.toFixed(2)}"/>`;b+=`<circle cx="${(i*c+c/2+2).toFixed(1)}" cy="${(j*c+c/2+1.5).toFixed(1)}" r="${(r*.9).toFixed(2)}"/>`}
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="none" stroke="var(--dim)"/><g fill="var(--ink2)">${b}</g><g fill="var(--ink1)">${a}</g></svg>`}
function risoHero(id){onPage(id,(p,t,el)=>{const k=ease(p),off=(1-k)*70,[a,b]=el.children;el.style.transform=`perspective(1100px) rotateY(${(-(1-k)*26).toFixed(1)}deg) rotateX(${((1-k)*12).toFixed(1)}deg)`;
 a.style.transform=`translate3d(${(-off).toFixed(1)}px,${(-off*.4).toFixed(1)}px,60px)`;b.style.transform=`translate3d(${(off+6*k).toFixed(1)}px,${(off*.5+4*k).toFixed(1)}px,-60px)`},.3)}
function risoBlobs(){onPage("ri-bl",(p,t,el)=>{const y=scrollY;[...el.children].forEach((b,i)=>b.style.transform=`translate3d(0,${(-y*(.15+i*.12)).toFixed(0)}px,0) rotate(${(y*.02*(i%2?1:-1)).toFixed(1)}deg)`)});
 return `<div class="blobs" id="ri-bl" aria-hidden="true"><i style="width:520px;height:520px;left:-120px;top:30vh;background:var(--ink1)"></i><i style="width:420px;height:420px;right:-100px;top:90vh;background:var(--ink2)"></i><i style="width:300px;height:300px;left:40%;top:170vh;background:var(--ink1)"></i></div>`}
R.riso={home(){const z=slowest;risoHero("ri-h");byCov.forEach((r,i)=>onView("ri-s"+i,(p,t,el)=>{const k=ease(clamp(p*1.3-.1));el.style.transform=`perspective(800px) translateY(${((1-k)*80).toFixed(0)}px) rotateX(${((1-k)*70).toFixed(1)}deg) rotateZ(${((1-k)*((i%3)-1)*9).toFixed(1)}deg)`;el.style.opacity=(.2+.8*k).toFixed(2);el.style.setProperty("--k",clamp(p*1.6-.35).toFixed(2))}));
 return `${risoBlobs()}<section class="wrap"><div class="poster"><div class="huge" id="ri-h" aria-hidden="true"><span class="a">${yrs(z.median_lag_days)}</span><span class="b">${yrs(z.median_lag_days)}</span></div>
 <div><h1>Years. That is how long ${nm(z.language)} waits for the median new topic.</h1><p class="lede">${nm(fastest.language)} waits ${yrs(fastest.median_lag_days)}. Lag is not fate; it is a gap you can measure, and close. Scroll: the inks snap into register.</p>${prov()}</div></div></section>
 <section class="wrap"><h2>Twenty languages, printed by coverage</h2><div class="stamps" role="list">${byCov.map((r,i)=>`<div class="stamp" id="ri-s${i}" role="listitem" aria-label="${nm(r.language)}: ${r.coverage_pct}% covered, median lag ${yrs(r.median_lag_days)} years"><div class="code">${r.language}</div>${halftone(r.coverage_pct/maxCov)}<div class="small"><b>${r.coverage_pct}%</b> · ${yrs(r.median_lag_days)} yrs<br><span class="nat" lang="${r.language}">${nat(r.language)}</span></div></div>`).join("")}</div>
 <p class="key">Dot size = coverage_pct relative to the highest (${maxCov}%). Values printed on every stamp.</p>${dataTable()}</section>
 <section class="wrap">${empties()}</section>`},
 pipe(){const w=900,h=220,bw=(w-20)/H.length;risoHero("ri-h");
 HOOK=i=>{HOUR=i;document.querySelectorAll("#hb g.col").forEach((g,j)=>g.setAttribute("opacity",j===i?1:.45));setT("rp",hourText(i))};
 onView("hb",(p,t,el)=>{const k=ease(clamp(p*1.2));el.querySelectorAll("g.col").forEach((g,j)=>{g.style.setProperty("--k",clamp(k*1.6-j/H.length*.6).toFixed(2))});el.style.transform=`perspective(900px) rotateX(${((1-k)*45).toFixed(1)}deg)`});
 return `${risoBlobs()}<section class="wrap"><div class="poster"><div class="huge" id="ri-h" aria-hidden="true"><span class="a">${LV.wikis}</span><span class="b">${LV.wikis}</span></div><div><h1>Wikis heard. Live. For $${P.cost.usd}.</h1><p class="lede">${fmt1(P.live.events_per_second)} events per second in the last window; ${fmt1(P.live.end_to_end_latency_s)} seconds from event to published table.</p>${replayCtl()}</div></div></section>
 <section class="wrap"><svg id="hb" viewBox="0 0 ${w} ${h}" style="width:100%;display:block;transform-origin:50% 100%" role="img" aria-label="Halftone columns of events per measured hour; peak ${fmt(maxH)}.">
 ${H.map((d,i)=>{const n=Math.round(18*d.events/maxH);let s="";for(let k=0;k<n;k++)s+=`<circle cx="${(10+i*bw+bw/2).toFixed(1)}" cy="${h-16-k*10}" r="${(bw/2-1.5).toFixed(1)}"/>`;return `<g class="col" fill="var(--ink1)" style="mix-blend-mode:var(--blend)">${s}</g>`}).join("")}
 <text x="10" y="${h-2}">${hr(H[0].hour)}</text><text x="${w-10}" y="${h-2}" text-anchor="end">${hr(H[H.length-1].hour)} UTC</text></svg><p class="key">One dot ≈ 1/18 of the peak hour (${fmt(maxH)} events), rounded. ${src("Σ live.json events by hour")}</p></section>
 <section class="wrap"><h2>Who did the work</h2>${P.engines.map(e=>`<span class="tag ${e.active?"on":"no"}" title="${esc(e.role)}">${esc(e.name)} · ${e.active?"ran":"not in last run"}</span>`).join("")}</section>`}};

/* ===== 6 Babel Tower ===== */
R.tower={home(){const FH=18,n=L.length,sc=Math.min(1,(innerWidth-32)/620);
 const floors=byCov.map((r,i)=>{const s=Math.round(40+250*r.coverage_pct/maxCov),lagp=Math.round(25+75*r.median_lag_days/maxLag);return `<div class="fl3" data-i="${i}">${box(s,FH-3,s,`color-mix(in srgb,var(--data) ${lagp}%,var(--dim))`)}</div>`}).join("");
 const tw=scene("tw-scn",440,`<div class="stage3d" aria-hidden="true"><div class="world" id="tw-w"><div class="ground"></div>${floors}</div></div>${hud("tw")}`,`A 3D tower built floor by floor: floor width = coverage, colour depth = median lag. The same data is in the table below.`,(p,t,el)=>{
  const wo=document.getElementById("tw-w");if(!wo)return;const built=p*1.2*n;wo.style.transform=`scale(${sc}) rotateX(-24deg) rotateY(${(35+t*9+p*140).toFixed(1)}deg)`;
  wo.querySelectorAll(".fl3").forEach(f=>{const i=+f.dataset.i,k=clamp(built-i);f.style.transform=`translate3d(0,${(-i*FH-FH/2-(1-ease(k))*420).toFixed(0)}px,0)`;f.style.opacity=k>0?1:0});
  const top=Math.min(n-1,Math.max(0,Math.floor(built)-1)),r=byCov[top];setT("tw-h",`Floor ${top+1}: ${nm(r.language)}`);setT("tw-s",`${r.coverage_pct}% of shared topics covered · median wait ${yrs(r.median_lag_days)} years · widest floor at the base`)},1);
 return `<section class="wrap"><h1>A tower of twenty tongues, still unfinished.</h1><p class="lede">Each floor is a language, as wide as its coverage of the shared topics; deeper colour means a longer median wait. Scroll to build it.</p>${prov()}</section>
 ${tw}<section class="wrap"><p class="key">Floor width = coverage_pct; colour depth = median_lag_days. Ordered widest at the base.</p>${dataTable()}</section>
 <section class="wrap">${empties()}</section>`},
 pipe(){const stages=[["stream","eventstreams-collector"],["bronze","delta-rs"],["silver","duckdb"],["checks","soda-core"],["gold","dbt-duckdb"],["export","babel-export"]],sc=Math.min(1,(innerWidth-32)/900);
 const cols=H.map((d,i)=>{const hh=Math.round(6+170*d.events/maxH);return `<div class="fl3 hc" data-i="${i}" style="transform:translate3d(${(i-H.length/2)*22}px,${-hh/2}px,-60px)">${box(16,hh,16,"var(--data)")}</div>`}).join("");
 const blocks=stages.map(([s,e],i)=>{const g=P.engines.find(x=>x.name===e),on=g&&g.active,hh=on?70:22;return `<div class="fl3" style="transform:translate3d(${(i-2.5)*110}px,${-hh/2}px,110px)">${box(56,hh,56,on?"var(--accent)":"var(--dim)")}</div>`}).join("");
 HOOK=i=>{HOUR=i;document.querySelectorAll("#site .hc").forEach(c=>c.firstElementChild.style.setProperty("--c",+c.dataset.i===i?"var(--accent)":"var(--data)"));setT("rp",hourText(i));setT("tp-h",hourText(i))};
 const site=scene("tp-scn",240,`<div class="stage3d" aria-hidden="true"><div class="world" id="tp-w" style="top:60%"><div class="ground"></div>${cols}${blocks}</div></div>${hud("tp")}`,`A 3D building site: ${H.length} columns of events per hour behind ${stages.length} stage blocks; a block stands tall only if its engine ran.`,(p,t,el)=>{
  const wo=document.getElementById("tp-w");if(wo)wo.style.transform=`scale(${sc}) rotateX(${lerp(-58,-16,ease(p)).toFixed(1)}deg) rotateY(${(-22+Math.sin(t*.2)*14+p*30).toFixed(1)}deg)`;setT("tp-s",`${P.engines.filter(e=>e.active).length} of ${P.engines.length} engines ran in the last run (tall blocks)`)},.6);
 return `<section class="wrap"><h1>The building site.</h1><p class="lede">Each stage is a block that stands tall only if its engine ran in the last measured run. Behind it, one column per measured hour of the live stream; the lit column is the hour being replayed.</p>${replayCtl()}</section>
 ${site}
 <section class="wrap"><p class="key">Blocks, left to right: ${stages.map(([s,e])=>`${s} (${e})`).join(", ")}.</p><div class="row2"><div><h2>${fmt1(P.live.events_per_second)} events/s</h2><span class="key">last window ${src("live.events_per_second")}</span></div><div><h2>${fmt(P.totals.events)} events</h2><span class="key">ingested in total ${src("totals.events")}</span></div><div><h2>$${P.cost.usd}</h2><span class="key">cost ${src("cost.usd")}</span></div></div></section>
 <section class="wrap"><h2>Engines</h2>${engines()}</section>`}};

// ---------- chrome + render ----------
function btn(g,key,val,label){const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",st[key]===val);b.onclick=()=>{st[key]=val;render();scrollTo(0,0)};document.getElementById(g).appendChild(b)}
function chrome(){["g-c","g-v","g-t","g-l"].forEach(g=>document.querySelectorAll(`#${g} button`).forEach(b=>b.remove()));
 CONCEPTS.forEach((c,i)=>btn("g-c","c",c.id,`${i+1} ${c.name}`));btn("g-v","v","home","Home (Now)");btn("g-v","v","pipeline","Pipeline Live");
 btn("g-t","t","light","Light");btn("g-t","t","dark","Dark");LOGO_KEYS.forEach(k=>btn("g-l","l",k,k[0].toUpperCase()+" "+k.slice(2)));
 const c=CONCEPTS.find(x=>x.id===st.c);document.getElementById("chrome-note").textContent=`${c.name}: ${c.tag} Every number comes from the sample export copies in sample-data/.`}
let timer=null;
function render(){cancelAnimationFrame(RAF);TIMERS.forEach(clearInterval);TIMERS=[];SC=[];HOOK=null;HOUR=H.length-1;
 const s=document.getElementById("site");TK=PAL[st.c][st.t];document.documentElement.dataset.theme=st.t;
 s.className="c-"+st.c;s.dataset.t=st.t;Object.entries(TK).forEach(([k,v])=>s.style.setProperty("--"+k,v));s.style.colorScheme=st.t;
 s.innerHTML=header(st.v==="home"?"Now":"Pipeline Live")+R[st.c][st.v==="home"?"home":"pipe"]()+footer();
 history.replaceState(null,"",`#c=${st.c}&v=${st.v}&t=${st.t}&l=${st.l}${+st.shot?"&shot=1":""}`);chrome();replay();
 if(FROZEN)requestAnimationFrame(()=>frame(0));else RAF=requestAnimationFrame(frame)}
// Data motion rule: brightness, size and highlight change only by measured hourly buckets. Camera and scroll motion are presentation.
function replay(){clearInterval(timer);const pp=document.getElementById("pp");if(pp)pp.onclick=()=>{st.paused=!st.paused;pp.textContent=st.paused?"Play":"Pause";if(st.paused)clearInterval(timer);else run()};
 if(!HOOK)return;const last=H.length-1;if(FROZEN||st.paused){HOOK(+st.shot?Math.round(last*.75):last);return}
 let i=0;const run=()=>{clearInterval(timer);timer=setInterval(()=>{i=(i+1)%H.length;HOOK(i)},650)};HOOK(i);run()}
addEventListener("resize",()=>{if(FROZEN)frame(0)});
render();
</script>
</body>
